<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker - Login</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon/fav.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  {% raw %}
  <script type="text/babel">
    const { useState, useEffect } = React;

    function LoginForm({ onSwitch }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError('');
        if (!username || !password) return setError('Please enter username and password');
        setLoading(true);
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (res.ok) window.location.href = '/dashboard';
          else setError(data.error || 'Login failed');
        } catch {
          setError('Connection error. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          {error && <div className="error-message">{error}</div>}
          <div className="input-group">
            <label>Username</label>
            <input type="text" placeholder="Enter your username" value={username}
              onChange={e => setUsername(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submit()}
              autoComplete="username" />
          </div>
          <div className="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" value={password}
              onChange={e => setPassword(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submit()}
              autoComplete="current-password" />
          </div>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Signing in...' : 'Sign In'}
          </button>
          <p className="auth-switch">
            Don't have an account?{' '}
            <a href="#" onClick={e => { e.preventDefault(); onSwitch(); }}>Create one</a>
          </p>
        </>
      );
    }

    function RegisterForm({ onSwitch }) {
      const [username, setUsername] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError('');
        if (!username || !email || !password) return setError('Please fill in all fields');
        setLoading(true);
        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password }),
          });
          const data = await res.json();
          if (res.ok) window.location.href = '/dashboard';
          else setError(data.error || 'Registration failed');
        } catch {
          setError('Connection error. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          <h2>Create Account</h2>
          <p className="form-subtitle">Start tracking your budget today</p>
          {error && <div className="error-message">{error}</div>}
          <div className="input-group">
            <label>Username</label>
            <input type="text" placeholder="Choose a username (min 3 characters)" value={username}
              onChange={e => setUsername(e.target.value)} autoComplete="username" />
          </div>
          <div className="input-group">
            <label>Email</label>
            <input type="email" placeholder="your.email@example.com" value={email}
              onChange={e => setEmail(e.target.value)} autoComplete="email" />
          </div>
          <div className="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a strong password" value={password}
              onChange={e => setPassword(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submit()}
              autoComplete="new-password" />
            <small className="password-requirements">
              Must be 8+ characters with uppercase, lowercase, number, and special character
            </small>
          </div>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Creating account...' : 'Create Account'}
          </button>
          <p className="auth-switch">
            Already have an account?{' '}
            <a href="#" onClick={e => { e.preventDefault(); onSwitch(); }}>Sign in</a>
          </p>
        </>
      );
    }

    function App() {
      const [mode, setMode] = useState('login');

      useEffect(() => {
        fetch('/api/check-auth').then(r => r.json())
          .then(d => { if (d.authenticated) window.location.href = '/dashboard'; })
          .catch(() => {});
      }, []);

      return (
        <div className="container">
          <div className="auth-container">
            <div className="auth-header">
              <div className="header-icon">💰</div>
              <h1>Budget Tracker</h1>
              <p className="auth-subtitle">Master your finances with style</p>
            </div>
            <div className="auth-form active">
              {mode === 'login'
                ? <LoginForm onSwitch={() => setMode('register')} />
                : <RegisterForm onSwitch={() => setMode('login')} />}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
