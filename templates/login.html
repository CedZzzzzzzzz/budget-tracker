<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='../images/favicon/fav.png') }}">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <div class="header-icon">💰</div>
                <h1>Budget Tracker</h1>
                <p class="auth-subtitle">Master your finances with style</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <div id="loginError" class="error-message hidden"></div>
                
                <button class="btn btn-primary" id="loginBtn">Sign In</button>
                
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="#" id="showRegisterLink">Create one</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <p class="form-subtitle">Start tracking your budget today</p>
                
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="registerUsername" placeholder="Choose a username (min 8 characters)" autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="your.email@example.com" autocomplete="email">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a strong password" autocomplete="new-password">
                    <small class="password-requirements">
                        Must be 8+ characters with uppercase, lowercase, number, and special character
                    </small>
                </div>
                
                <div id="registerError" class="error-message hidden"></div>
                
                <button class="btn btn-primary" id="registerBtn">Create Account</button>
                
                <p class="auth-switch">
                    Already have an account? 
                    <a href="#" id="showLoginLink">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
